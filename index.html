<title>MUNIMO v3.7.17</title>
<style>
:root{font-family:'Zen Maru Gothic','Hiragino Maru Gothic ProN',system-ui,sans-serif;color:#594941;--ink:#594941;--muted:#9c8982;--rose:#d98891;--line:#f0e2d8;--cream:#fbf3ec;--panel:#fffdf9;--accent:#ed8f9c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 13% 0%,#fffdfa 0,transparent 55%),var(--cream)}
body{overscroll-behavior-y:contain}
button{font:inherit;cursor:pointer}
.wrap{width:min(100%,750px);margin:0 auto;padding:18px clamp(15px,3.8vw,28px) calc(18px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:3px 3px 14px}
.logoTop{display:flex;align-items:center;gap:10px}.mark{width:46px;height:46px;display:grid;place-items:center;background:#fff9fc;border:1px solid #f8dde1;border-radius:17px;transform:rotate(-7deg);box-shadow:0 5px 0 #efdbda;position:relative}
.mark:before,.mark:after{content:'';position:absolute;background:#efa0ac;border-radius:50%}.mark:before{width:23px;height:23px;top:8px;left:6px}.mark:after{width:15px;height:15px;bottom:9px;right:5px;background:#ffd7a4}
.mark span{z-index:1;font-weight:900;font-size:18px;color:white;text-shadow:0 1px 2px #b46d78;transform:rotate(7deg)}
.eyebrow{font:900 10px/1.4 Nunito,sans-serif;letter-spacing:.18em;color:#c29588}.nameLogo{font-size:26px;line-height:1.12;font-weight:900;letter-spacing:.045em;color:#815d61}
.headerPill{border-radius:99px;background:#fffdfb;border:1px solid #eddccf;padding:8px 12px;font:800 11px Nunito,sans-serif;color:#b58c80;white-space:nowrap}
.studio{position:relative;height:clamp(305px,57vh,540px);max-height:590px;border-radius:30px;background:radial-gradient(ellipse at 46% 34%,#fffcf8 0,#fff7f0 44%,#fcece8 100%);border:1px solid #f0dfd7;box-shadow:0 10px 30px #cd9c8d19,inset 0 0 0 7px #fffaf777,inset 0 0 20px #dca7a322;overflow:hidden;isolation:isolate}
.studio:before{content:'';position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(#e8c8bd60 1px,transparent 1.4px);background-size:24px 24px;mask-image:radial-gradient(ellipse,transparent 32%,black 100%);opacity:.36}
#squishCanvas{position:absolute;width:100%;height:100%;inset:0;display:block;touch-action:none;cursor:grab;z-index:2}#squishCanvas:active{cursor:grabbing}
.stamp{z-index:3;position:absolute;left:19px;top:18px;pointer-events:none}.stamp .txt{font:900 11px Nunito,sans-serif;letter-spacing:.12em;color:#cda99e}.stamp .small{display:block;font-size:11px;color:#a88c82;margin-top:3px}
.studio.touching .stamp,.studio.touching .materialPill{opacity:.12;transition:opacity .18s ease}
.materialPill{position:absolute;top:18px;right:17px;z-index:3;background:#fff9f1c7;border:1px solid #efdcd0;color:#a97875;border-radius:20px;padding:7px 12px;font-size:12px;font-weight:700;pointer-events:none}
.softShadow{position:absolute;left:50%;top:64%;width:48%;height:14%;transform:translateX(-50%);border-radius:50%;background:#a46a6066;filter:blur(30px);opacity:.27;pointer-events:none;z-index:1}
.hint{position:absolute;bottom:17px;left:50%;transform:translateX(-50%);z-index:3;background:#ffffffc9;border:1px solid #f4e6df;box-shadow:0 2px 13px #c8a99f20;border-radius:99px;padding:8px 15px;white-space:nowrap;font-size:12px;font-weight:700;color:#aa8782;pointer-events:none;transition:opacity .4s}
.under{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:17px 3px 8px}.currentName{font-size:22px;font-weight:900;color:#775453}.currentDesc{font-size:12px;color:#aa8b83;margin-top:4px}.controlBtns{display:flex;align-items:center;gap:8px}.iconBtn{min-width:39px;height:39px;border:1px solid #eddbd1;border-radius:14px;background:#fffdfa;color:#9b7975;font-size:20px;display:grid;place-items:center;box-shadow:0 3px 0 #f2e4dd}.iconBtn:active{transform:translateY(2px);box-shadow:none}
.titleRow{display:flex;align-items:center;justify-content:space-between;margin:13px 2px 10px}.sectionName{font-size:15px;font-weight:900;color:#775753}.sectionSub{font-size:11px;font-weight:700;color:#ba9790}
.shelf{display:flex;gap:9px;overflow-x:auto;scroll-snap-type:x mandatory;padding:3px 2px 12px;scrollbar-width:none}.shelf::-webkit-scrollbar{display:none}
.toyCard{flex:0 0 101px;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 5px 9px;border:1.5px solid #f0e0d7;background:#fffdf9;border-radius:19px;box-shadow:0 4px 0 #efded7;transition:border-color .12s,transform .12s;color:#856d65;gap:2px}.toyCard[aria-pressed="true"]{background:#fff7f5;border-color:#eba5aa;box-shadow:0 4px 0 #edc2c0;transform:translateY(-1px)}
.toyCard canvas{width:79px;height:68px;object-fit:contain;pointer-events:none}.toyCard span{font-size:11px;font-weight:900;white-space:nowrap}.toyCard i{font-style:normal;font-size:9px;color:#bba49d}
.settings{background:#fffefa;border:1px solid #eddcd3;border-radius:23px;padding:15px 14px;margin-top:8px;box-shadow:0 4px 15px #c9a28e10}
.settingTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}.settingTitle{font-size:14px;font-weight:900}.settingTip{font-size:10px;color:#b4998c;white-space:nowrap}
.materials{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.matBtn{min-width:0;background:#faf5ef;border:1px solid #f1e4da;border-radius:14px;padding:10px 2px;color:#a38a80;font-size:12px;font-weight:900;white-space:nowrap}.matBtn[aria-pressed="true"]{background:#fce9e9;border-color:#e9b8ba;color:#ad676f}.matBtn .em{font-size:14px}

footer{text-align:center;font-size:10px;color:#b59a8f;line-height:1.6;margin:14px 0 0}
@media (max-width:390px){.nameLogo{font-size:24px}.studio{height:clamp(295px,49vh,420px)}.wrap{padding-left:13px;padding-right:13px}.toyCard{flex-basis:92px}.settings{padding:14px 11px}.under{padding-top:13px}.currentName{font-size:20px}}
@media (max-height:740px){.studio{height:clamp(282px,48vh,390px)}}
@media (prefers-reduced-motion:reduce){.toyCard,.hint,.iconBtn{transition:none}}

/* Touch feel workshop */
.feelLab{margin-top:13px;border:1px solid #f0e0d8;border-radius:17px;background:#fffbf8;overflow:hidden}
.feelLab>summary{list-style:none;cursor:pointer;min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;font-size:12px;font-weight:900;color:#8d6467;user-select:none}
.feelLab>summary::-webkit-details-marker{display:none}
.feelLab>summary .labArrow{color:#b58d88;font-size:16px;transition:transform .2s}
.feelLab[open]>summary .labArrow{transform:rotate(180deg)}
.feelLab>summary:focus-visible,.labReset:focus-visible,.feelSlider:focus-visible{outline:2px solid #d58a9b;outline-offset:2px}
.feelLabInner{padding:2px 12px 14px;border-top:1px solid #f3e5df}
.labLead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:10px 0 11px}
.labStatus{font-size:11px;color:#a3817d;font-weight:800}.labReset{background:#fff9f5;border:1px solid #edd9d1;border-radius:10px;color:#a37b79;padding:7px 10px;font-weight:800;font-size:11px}
.labReset:disabled{opacity:.42;cursor:default}.labActions{display:flex;gap:6px;flex-wrap:wrap}
.feelSliders{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 17px}
.feelControl{display:block;min-width:0}
.feelControlHeader{display:flex;justify-content:space-between;gap:5px;align-items:baseline;font-size:11px;font-weight:900;color:#816564}
.feelValue{color:#bb7b85;font:800 11px Nunito,system-ui,sans-serif;white-space:nowrap;font-variant-numeric:tabular-nums}
.feelDesc{display:block;font-size:10px;color:#ad978f;line-height:1.4;min-height:28px;margin-top:2px}
.feelSlider{-webkit-appearance:none;appearance:none;width:100%;height:23px;padding:0;margin:6px 0 0;background:transparent;cursor:pointer;touch-action:pan-y}
.feelSlider::-webkit-slider-runnable-track{height:8px;border-radius:20px;background:linear-gradient(90deg,#ffe2df,#efbdc5);border:1px solid #e9c2c5}
.feelSlider::-moz-range-track{height:8px;border-radius:20px;background:linear-gradient(90deg,#ffe2df,#efbdc5);border:1px solid #e9c2c5}
.feelSlider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;height:22px;width:22px;margin-top:-8px;background:#fffaf9;border:3px solid #dd929e;border-radius:50%;box-shadow:0 2px 5px #a0717140}
.feelSlider::-moz-range-thumb{height:17px;width:17px;background:#fffaf9;border:3px solid #dd929e;border-radius:50%;box-shadow:0 2px 5px #a0717140}
.feelScale{display:flex;justify-content:space-between;font-size:9px;color:#b7a19a;margin-top:-2px}
.feelAdvanced{margin-top:14px;border-top:1px dashed #efdfdb;padding-top:9px}
.feelAdvanced>summary{font-size:11px;font-weight:900;color:#97787b;cursor:pointer;padding:6px 0}
.feelAdvanced .feelSliders{padding-top:11px}
.labFoot{font-size:10px;color:#ab928a;line-height:1.6;margin:12px 0 0}
@media(max-width:410px){.feelSliders{grid-template-columns:minmax(0,1fr);gap:11px}.feelDesc{min-height:0}.feelLabInner{padding:2px 12px 12px}}


/* Color ways for the compatible squishies; never obstruct the play area. */
.colorLab{background:#fffdf6;border:2px solid #f3ddb6;border-radius:21px;
  margin:6px 5px 12px;padding:10px 12px 12px;box-shadow:0 3px 0 #f5e7cc,inset 0 0 0 3px #fffaf1}
.colorLab[hidden]{display:none!important}
.colorLabHead{display:flex;justify-content:space-between;align-items:center;gap:9px;margin-bottom:8px}
.colorLabTitle{font-size:13px;font-weight:900;color:#916d67;white-space:nowrap}
.colorLabPicked{font-size:11px;font-weight:800;color:#b47a8c}
.colorSwatches{display:flex;gap:6px;overflow-x:auto;padding:4px 1px 6px;scrollbar-width:thin;scrollbar-color:#e6bfc7 transparent}
.colorChoice{min-width:46px;flex:1 0 46px;max-width:75px;display:flex;align-items:center;
  flex-direction:column;gap:4px;border:1.5px solid transparent;border-radius:14px;
  background:transparent;padding:5px 2px 4px;color:#89776c;font-size:10px;font-weight:800;line-height:1.15}
.colorChoice:focus-visible{outline:3px solid #79c7bb;outline-offset:1px}
.colorChoice[aria-pressed=true]{border-color:#e899ad;background:#fff0f4}
.colorDot{width:33px;height:33px;border-radius:50%;background:var(--swatch);
  box-shadow:inset -4px -5px 8px #603f3f14,inset 3px 3px 5px #fff9,0 2px 0 #d9c8b9;
  border:2px solid #fff;outline:1px solid #ead8d0}
.colorChoice[aria-pressed=true] .colorDot{outline:2px solid #d67f9b;outline-offset:2px}
.colorChoice span:last-child{white-space:nowrap}
.colorLabNote{font-size:10px;color:#ad9a8d;margin-top:2px}
@media(max-width:410px){.colorLab{margin:4px 2px 10px;padding:10px 7px 9px}.colorSwatches{gap:3px}.colorChoice{min-width:46px;padding:5px 1px 4px}}
/* ========== v3.7.0 : pastel toy-shop visual system ========== */
:root{
  --ink:#665a56;--muted:#9c8884;--rose:#ec97ac;--line:#ead9c5;
  --cream:#fffaf0;--panel:#fffdf4;--accent:#f39cb2;
  --mint:#7bc8bc;--mint-deep:#428e87;--lemon:#ffe798;
}
html,body{
  background:radial-gradient(ellipse at 10% 15%,#fff9d8 0,transparent 32%),
             radial-gradient(ellipse at 90% 58%,#fcebf1 0,transparent 44%),
             repeating-linear-gradient(0deg,transparent 0 43px,#efdfc83d 44px 45px),
             #fff6de;
  color:var(--ink);
}
.wrap{width:min(100%,1120px);padding:12px clamp(10px,2.5vw,28px) calc(20px + env(safe-area-inset-bottom))}
header{
  position:relative;overflow:hidden;isolation:isolate;min-height:105px;
  padding:15px clamp(13px,2.5vw,27px) 19px;margin-bottom:16px;
  border:4px solid #fffef8;border-radius:31px 31px 24px 24px;
  box-shadow:0 5px 0 #ebd28d,0 10px 20px #d9b77c26;
  background:
    repeating-linear-gradient(90deg,transparent 0 17px,#fff9cb6d 18px 22px,#f5d77937 23px 39px),
    repeating-linear-gradient(0deg,transparent 0 12px,#dfad5840 13px 14px,transparent 15px 26px),
    linear-gradient(170deg,#ffeb9d,#ffe59d 55%,#fff2b8);
}
header:before{content:"";position:absolute;inset:7px;border:2px dashed #fffefbd1;border-radius:22px;pointer-events:none}
header:after{content:'✦';position:absolute;right:87px;bottom:7px;font-size:22px;color:#f4a0b2;transform:rotate(20deg);text-shadow:0 2px 0 white}
.logoTop{position:relative;z-index:1;gap:12px;min-width:0}
.mark{
  width:57px;height:57px;flex:none;border:3px solid white;border-radius:21px;
  box-shadow:0 5px 0 #d19e9d7d,0 2px 10px #d7aa8a4a;
  background:linear-gradient(145deg,#ffe8f1,#fffaf5 55%,#d8f6e9);
}
.mark:before{top:10px;left:7px;width:30px;height:30px;background:#efa5bd}
.mark:after{right:6px;bottom:10px;width:19px;height:19px;background:#ffcd7f}
.mark span{font-size:23px;text-shadow:0 2px 1px #bf789c}
.eyebrow{color:#ac8c77;font-size:9px;letter-spacing:.13em;font-weight:900;text-shadow:0 1px white}
.nameLogo{
  font-size:clamp(24px,3.6vw,37px);letter-spacing:.02em;line-height:1.2;
  color:#ec8e9f;-webkit-text-stroke:3px #fffdfa;paint-order:stroke fill;
  filter:drop-shadow(1px 3px 0 #ba799b8e);text-shadow:none;

.headerPill{
  position:relative;z-index:1;min-width:73px;text-align:center;padding:9px 12px;
  background:#fffef6;border:3px solid #fff;
  outline:2px dashed #85cfc0;outline-offset:-7px;
  box-shadow:0 3px 0 #9dcfc1;color:#669f94;
  font-size:12px;
}
.gameLayout{display:block}
.playPanel,.sidePanel{min-width:0}
.studio{
  height:clamp(340px,58vh,640px);max-height:none;
  border:7px solid #fffefd;border-radius:31px;
  background:
    radial-gradient(ellipse at 46% 42%,#fffefa 0,#fffdf3 40%,#fff7ed 82%,#ffeced 100%);
  box-shadow:0 5px 0 #e4d9c6,0 13px 28px #cebd9b35,inset 0 0 0 2px #c9e7dd;
}
.studio:before{
  background-image:radial-gradient(#f0dbb672 .8px,transparent 1.4px);

}

  content:"";pointer-events:none;position:absolute;inset:11px;

  color:#4b9386;border-radius:20px;box-shadow:0 3px 0 #8ecabc5c;
  padding:7px 13px;font-size:11px;
}
.softShadow{background:#bd898562;opacity:.2;filter:blur(35px)}

  box-shadow:0 3px 0 #e5d1bd5e;bottom:15px;font-size:11px;padding:7px 13px;
}

  box-shadow:0 3px 0 #efdbc7,0 0 0 1px #f1e7d8;
}
.currentName{font-size:clamp(18px,2vw,23px);color:#805e67}
.currentDesc{font-size:11px;color:#ae9087;line-height:1.5}
.controlBtns{flex-shrink:0;gap:8px}
.iconBtn{
  min-width:43px;height:43px;background:linear-gradient(#ffffff,#e4faf1);
  border:3px solid #fff;border-radius:15px;
  box-shadow:0 4px 0 #a7d8c8,0 0 0 1px #bce0cf;
  color:#5ca497;font-size:23px;
}
.iconBtn:focus-visible,.toyCard:focus-visible,.matBtn:focus-visible{outline:3px solid #e993ac;outline-offset:3px}
.titleRow{
  position:relative;margin:19px 2px 12px;min-height:48px;padding:10px 14px;
  background:linear-gradient(90deg,#f9b0bf,#ffd5d9);
  border:3px solid #fff;border-radius:20px 20px 14px 14px;
  box-shadow:0 4px 0 #e8c0bd,0 0 0 1px #efb8c1;
}
.titleRow:after{content:'✿';position:absolute;top:-10px;right:18px;color:#fffdf8;font-size:26px;text-shadow:0 2px #e28ea8;transform:rotate(-16deg)}
.sectionName{color:#874e6c;text-shadow:0 1px white;font-size:15px;letter-spacing:.02em}
.sectionName:before{content:'★';font-size:17px;color:#fffefa;text-shadow:1px 1px #c87f95;padding-right:7px}
.sectionSub{font-size:10px;color:#9d6174;padding-right:22px}
.shelf{
  display:flex;gap:11px;padding:8px 3px 12px;
  overflow-x:auto;overscroll-behavior-inline:contain;scrollbar-width:none;
}
.toyCard{
  --card-top:#eafdf4;--card-foot:#b9eac7;--card-txt:#497e68;
  position:relative;flex:0 0 123px;gap:0;justify-content:stretch;
  padding:4px 4px 4px;min-height:138px;overflow:hidden;
  border:3px solid white;border-radius:22px;
  background:var(--card-top);box-shadow:0 5px 0 #ded6c8,0 0 0 1px #e7ded0;
  transition:transform .17s ease,box-shadow .17s ease,border-color .17s ease;
  color:var(--card-txt);
}
.toyCard:nth-child(4n+2){--card-top:#fceff8;--card-foot:#f6bfc7;--card-txt:#995b72}
.toyCard:nth-child(4n+3){--card-top:#f3f3ff;--card-foot:#d2c5f0;--card-txt:#74649e}
.toyCard:nth-child(4n){--card-top:#fff8de;--card-foot:#f6d793;--card-txt:#99764b}
.toyCard[aria-pressed="true"]{
  background:var(--card-top);border-color:#f49bad;
  box-shadow:0 5px 0 #e5adbb,0 0 0 2px #fffdf6;transform:translateY(-2px);
}
.toyCard[aria-pressed="true"]:after{
  content:'✓';position:absolute;right:7px;top:6px;z-index:2;color:#fff;
  background:#ed8faa;border:2px solid white;border-radius:50%;
  width:20px;height:20px;display:grid;place-items:center;font-size:12px;font-weight:900;
}
.cardArt{
  position:relative;display:grid;place-items:center;width:100%;height:86px;
  border-radius:15px 15px 8px 8px;
  background:radial-gradient(ellipse at 44% 25%,#ffffffdb,transparent 57%),
             linear-gradient(155deg,#e3fff3,var(--card-top));
}

.toyCard:nth-child(4n+2) .cardArt:before{color:#e9aac9}
.toyCard canvas{width:101px;height:80px;object-fit:contain;position:relative;z-index:1;filter:drop-shadow(0 3px 1px #9a87751f)}
.cardMeta{
  position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  width:100%;min-height:47px;margin-top:-2px;
  border-radius:43% 43% 12px 12px / 9px 9px 12px 12px;
  background:var(--card-foot);padding:7px 2px 4px;
}

  height:0;border-top:1.5px dashed #ffffffc2;
}
.toyCard span{font-size:11px;letter-spacing:-.03em;color:var(--card-txt);line-height:1.35;max-width:100%;text-align:center;white-space:normal;overflow-wrap:anywhere}
.toyCard i{font-size:9px;line-height:1.4;color:var(--card-txt);opacity:.78}
.settings{
  margin-top:16px;padding:15px 13px 14px;
  background:linear-gradient(180deg,#fffef3,#fffef9);
  border:4px solid #fff;border-radius:25px;
  outline:2px dashed #e9dfbf;outline-offset:-11px;
  box-shadow:0 5px 0 #e4d6b9,0 7px 17px #d0bfa02d;
}
.settingTop{padding:9px 12px 9px;margin:1px 0 13px;
  background:linear-gradient(90deg,#a9e8bc,#d2f2d1);border:2px solid #fff;
  box-shadow:0 3px 0 #b4dbb8;border-radius:14px;
}
.settingTitle{font-size:14px;color:#47836c;text-shadow:0 1px #fff}
.settingTip{font-size:10px;color:#64988b;white-space:normal;text-align:right;line-height:1.3}
.materials{gap:8px}
.matBtn{
  min-height:45px;border:3px solid #fff;background:linear-gradient(#f4fffa,#d8f4e8);
  color:#649387;box-shadow:0 3px 0 #b8dccc;border-radius:15px;

 bodyOffset.x+=bodyOffset.vx*dt;bodyOffset.y+=bodyOffset.vy*dt;
 for(let i=0;i<points.length;i++){
  const p=points[i];let targetX=p.rx,targetY=p.ry;
  for(const touch of ps){
   const dx=p.rx-touch.sx,dy=p.ry-touch.sy,r2=dx*dx+dy*dy;
   const dragX=touch.pullX,dragY=touch.pullY;

   // pulling a needle-thin spike. This avoids a sharp mesh constraint wall.
   const spread=m.dragRadius+.24*Math.hypot(dragX,dragY)+.64*(dragX*dragX+dragY*dragY);

  }

   if(touch.depth<.002)continue;

  // displaced by the wall runs sideways along that SAME wall, like mochi/slime.
  // Broad smooth weights prevent a rigid flat tile or sharp folded spike.
  const wr=wallPressure.right,wl=wallPressure.left;

  if(gy>0){const q=points[i-N];coupledX+=q.x-q.rx-(p.x-p.rx);coupledY+=q.y-q.ry-(p.y-p.ry);n++}
  if(gy<N-1){const q=points[i+N];coupledX+=q.x-q.rx-(p.x-p.rx);coupledY+=q.y-q.ry-(p.y-p.ry);n++}

 // Keep the cell grid invertible after a rare emergency opposite-wall fit.
 constrainGeometry();
 collideWithBox();

 for(let i=0;i<points.length;i++){
  const p=points[i];

  maxVelocity=Math.max(maxVelocity,Math.abs(p.vx),Math.abs(p.vy));
